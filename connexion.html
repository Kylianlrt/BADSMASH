<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre espace joueur BADSMASH.">
    <meta name="theme-color" content="#0a1a2e">
    <title>BADSMASH - Se Connecter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a1120; --bg-2: #0d1730; --card: #141e32;
            --green: #22c55e; --green-light: #4ade80; --violet: #8b5cf6;
            --text: #f3f7fa; --sub: #9aa9c4; --border: #263455; --accent: #4f8fd1; --danger: #ef3d4e;
            --glow: rgba(34,197,94,0.3);
        }
        :root[data-theme="light"] {
            --bg: #eef2f9; --bg-2: #e3e9f5; --card: #ffffff;
            --green: #16a34a; --green-light: #22c55e;
            --text: #101828; --sub: #52607a; --border: #dbe2ee;
            --glow: rgba(22,163,74,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; 
            transition: background-color .4s cubic-bezier(0.16,1,0.3,1), color .4s cubic-bezier(0.16,1,0.3,1);
            background-image:
                radial-gradient(circle at 15% 10%, var(--glow) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(139,92,246,0.12) 0%, transparent 45%);
            position: relative;
            overflow: hidden;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s cubic-bezier(0.16,1,0.3,1);
            z-index: 10;
        }
        .theme-toggle:hover { transform: rotate(20deg); border-color: var(--green); }
        .login-card { 
            background: var(--card); 
            padding: 36px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.4);
            position: relative;
            opacity: 0;
            transform: translateY(18px);
            animation: cardIn .7s cubic-bezier(0.16,1,0.3,1) .1s forwards;
            transition: background-color .4s, border-color .4s;
        }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
        .logo {
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.4rem;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            display: block;
            text-decoration: none;
            transition: transform .25s cubic-bezier(0.16,1,0.3,1), filter .25s;
        }
        .logo:hover { transform: scale(1.05); filter: drop-shadow(0 0 10px var(--glow)); }
        .logo span { color: var(--green); }
        .subtitle {
            text-align: center;
            color: var(--sub);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--sub); }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--bg); 
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow .2s;
        }
        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--glow); }
        button { 
            width: 100%; 
            background: linear-gradient(135deg, var(--green-light), var(--green));
            color: #fff; 
            border: none; 
            padding: 13px; 
            border-radius: 8px; 
            font-size: 1rem;
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            box-shadow: 0 8px 20px var(--glow);
            transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow .25s;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: translateX(-120%);
            transition: transform .6s cubic-bezier(0.16,1,0.3,1);
        }
        button:hover::before { transform: translateX(120%); }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px var(--glow); }
        .footer-links {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            font-size: 0.85rem;
        }
        .footer-links a {
            color: var(--accent);
            text-decoration: none;
        }
        .footer-links a:hover { text-decoration: underline; }
        .error-message {
            background: rgba(239, 61, 78, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
<!-- ===== BADSMASH — Décor : volants flottants ===== -->
<div class="badsmash-shuttles" aria-hidden="true">
    <span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span>
    <span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span><span>🏸</span>
</div>
<style>
    .badsmash-shuttles { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .badsmash-shuttles span {
        position: absolute; bottom: -10%; display: block; opacity: .28;
        filter: drop-shadow(0 0 6px rgba(34,197,94,.3));
        animation: badsmashShuttleFloat linear infinite;
        will-change: transform, opacity;
    }
    :root[data-theme="light"] .badsmash-shuttles span { opacity: .2; filter: drop-shadow(0 0 6px rgba(22,163,74,.22)); }
    @keyframes badsmashShuttleFloat {
        0%   { transform: translate(0,0) rotate(-20deg); opacity: 0; }
        10%  { opacity: .28; }
        50%  { transform: translate(30px,-58vh) rotate(15deg); }
        90%  { opacity: .28; }
        100% { transform: translate(-25px,-118vh) rotate(-15deg); opacity: 0; }
    }
    .badsmash-shuttles span:nth-child(1)  { left: 4%;  font-size: 20px; animation-duration: 17s; animation-delay: -2s; }
    .badsmash-shuttles span:nth-child(2)  { left: 14%; font-size: 14px; animation-duration: 13s; animation-delay: -8s; }
    .badsmash-shuttles span:nth-child(3)  { left: 24%; font-size: 24px; animation-duration: 21s; animation-delay: -4s; }
    .badsmash-shuttles span:nth-child(4)  { left: 34%; font-size: 16px; animation-duration: 15s; animation-delay: -11s; }
    .badsmash-shuttles span:nth-child(5)  { left: 44%; font-size: 22px; animation-duration: 19s; animation-delay: -6s; }
    .badsmash-shuttles span:nth-child(6)  { left: 54%; font-size: 15px; animation-duration: 14s; animation-delay: -1s; }
    .badsmash-shuttles span:nth-child(7)  { left: 64%; font-size: 26px; animation-duration: 23s; animation-delay: -14s; }
    .badsmash-shuttles span:nth-child(8)  { left: 73%; font-size: 17px; animation-duration: 16s; animation-delay: -9s; }
    .badsmash-shuttles span:nth-child(9)  { left: 82%; font-size: 21px; animation-duration: 18s; animation-delay: -3s; }
    .badsmash-shuttles span:nth-child(10) { left: 90%; font-size: 14px; animation-duration: 12s; animation-delay: -7s; }
    .badsmash-shuttles span:nth-child(11) { left: 9%;  font-size: 18px; animation-duration: 20s; animation-delay: -16s; }
    .badsmash-shuttles span:nth-child(12) { left: 59%; font-size: 19px; animation-duration: 22s; animation-delay: -18s; }
    @media (prefers-reduced-motion: reduce) { .badsmash-shuttles { display: none; } }
</style>


<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Changer de thème">🌙</button>

<div class="login-card">
    <a href="index.html" class="logo">BAD<span>SMASH</span></a>
    <div class="subtitle">Espace Joueur</div>

    <div class="error-message" id="error-box">Identifiants incorrects ou compte introuvable.</div>

    <form id="form-login">
        <div class="form-group">
            <label for="login-id">Identifiant (prénom.nom)</label>
            <input type="text" id="login-id" required autocomplete="username" placeholder="ex: jean.dupont">
        </div>
        <div class="form-group">
            <label for="login-pass">Mot de passe</label>
            <input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="btn-submit">Se connecter</button>
    </form>

    <div class="footer-links">
        <a href="admin.html">Accès Administrateur</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD5qiseJI4b-CwIGzKi8XYA6pSPqiMRV24",
        authDomain: "badsmash-a5580.firebaseapp.com",
        projectId: "badsmash-a5580",
        storageBucket: "badsmash-a5580.firebasestorage.app",
        messagingSenderId: "9725882238",
        appId: "1:9725882238:web:1c1cdb40da0218f2828d2f",
        databaseURL: "https://badsmash-a5580-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('form-login');
    const errorBox = document.getElementById('error-box');

    function normalizeFullIdentifiant(str) {
        return (str || '')
            .toString()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim()
            .replace(/\s+/g, '')
            .replace(/[^a-z0-9.]+/g, '');
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';

        const identifiant = normalizeFullIdentifiant(document.getElementById('login-id').value);
        const pass = document.getElementById('login-pass').value.trim();

        onValue(ref(db, 'joueurs'), (snapshot) => {
            const data = snapshot.val();
            let loggedUserKey = null;

            if (data) {
                Object.keys(data).forEach(id => {
                    const joueur = data[id];
                    const joueurId = normalizeFullIdentifiant(joueur.identifiant || joueur.email || '');
                    if (joueur.hasAccount && joueurId === identifiant && joueur.password === pass) {
                        loggedUserKey = id;
                    }
                });
            }

            if (loggedUserKey) {
                localStorage.setItem('badsmash_user_id', loggedUserKey);
                window.location.href = 'mon-espace.html';
            } else {
                errorBox.style.display = 'block';
            }
        }, { onlyOnce: true });
    });
</script>

<script>
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
        localStorage.setItem('badsmash_theme', theme);
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
    }
    (function initTheme() {
        const saved = localStorage.getItem('badsmash_theme');
        const preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        applyTheme(saved || (preferLight ? 'light' : 'dark'));
    })();
</script>

</body>
</html>
