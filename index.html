<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BADSMASH : tableaux et classements de badminton du club, à consulter à tout moment.">
    <meta name="theme-color" content="#0a1a2e">
    <title>BADSMASH — Tableaux &amp; Classements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :focus-visible { outline: 3px solid #4fd08a; outline-offset: 4px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
        :root {
            --bg-dark: #0a1120;
            --bg-dark-2: #0d1730;
            --bg-card: rgba(20, 30, 50, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent: #22c55e;
            --accent-light: #4ade80;
            --accent-glow: rgba(34, 197, 94, 0.35);
            --accent-2: #8b5cf6;
            --accent-2-glow: rgba(139, 92, 246, 0.3);
            --accent-gold: #fbbf24;
            --accent-red: #ef3d4e;
            --text-main: #f3f7fa;
            --text-sub: #9aa9c4;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition: cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-dark: #eef2f9;
            --bg-dark-2: #e3e9f5;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-border: rgba(15, 23, 42, 0.08);
            --accent: #16a34a;
            --accent-light: #22c55e;
            --accent-glow: rgba(22, 163, 74, 0.25);
            --accent-2: #7c3aed;
            --accent-2-glow: rgba(124, 58, 237, 0.2);
            --text-main: #101828;
            --text-sub: #52607a;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color .4s var(--transition), color .4s var(--transition);
            background-image: 
                radial-gradient(circle at 15% 20%, var(--accent-glow) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, var(--accent-2-glow) 0%, transparent 40%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .36;
            background-image: linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black, transparent 72%);
            transition: opacity .4s var(--transition);
        }
        :root[data-theme="light"] body::before { opacity: .5; }

        /* Header UI — flottant, sans bandeau plein ni bordure */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 300;
            pointer-events: none;
            animation: headerDrop .8s var(--transition) both;
        }
        @keyframes headerDrop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }

        header > * { pointer-events: auto; }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .burger-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            width: 44px;
            height: 32px;
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .burger { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .burger span {
            display: block;
            height: 1px;
            width: 100%;
            background: currentColor;
            transition: all 0.35s cubic-bezier(0.76,0,0.24,1);
        }
        .burger span:nth-child(2) { width: 65%; align-self: flex-end; }
        .burger-btn.active .burger span:nth-child(1) { transform: rotate(45deg) translate(8px,8px); width: 100%; }
        .burger-btn.active .burger span:nth-child(2) { opacity: 0; transform: translateX(10px); }
        .burger-btn.active .burger span:nth-child(3) { transform: rotate(-45deg) translate(8px,-8px); width: 100%; }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            font-weight: 400;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform .25s var(--transition), filter .25s var(--transition);
        }
        .logo:hover { transform: scale(1.05); filter: drop-shadow(0 0 10px var(--accent-glow)); }

        .logo span { color: var(--accent); }

        .btn-login {
            color: var(--bg-dark);
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            border: 1px solid transparent;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.85rem;
            box-shadow: 0 8px 20px var(--accent-glow);
            transition: all 0.3s var(--transition);
            position: relative;
            overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: translateX(-120%);
            transition: transform .6s var(--transition);
        }
        .btn-login:hover::before { transform: translateX(120%); }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--accent-glow);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-main);
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            transition: all 0.3s var(--transition);
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
            color: #fff;
            box-shadow: 0 0 18px var(--accent-2-glow);
            transform: rotate(20deg);
        }
        .header-right { display: flex; align-items: center; gap: 10px; }

        /* Menu Latéral Burger — style "glass panel" (panneau vitré, liens numérotés) */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 15, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--transition);
        }

        .drawer-overlay.active { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed;
            top: 0;
            left: -100%;
            width: min(420px, 100vw);
            height: 100%;
            z-index: 201;
            padding: 110px 48px 48px;
            background: rgba(10, 17, 32, 0.97);
            border-right: 1px solid var(--bg-card-border);
            transition: left 0.55s cubic-bezier(0.76,0,0.24,1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        :root[data-theme="light"] .drawer { background: rgba(238, 242, 249, 0.98); }

        .drawer::before {
            content: '';
            position: absolute;
            top: -100px; left: -100px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--accent-glow), transparent 65%);
            pointer-events: none;
        }

        .drawer.active { left: 0; }

        .drawer-header {
            position: absolute;
            top: 28px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--bg-card-border);
            color: var(--text-sub);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s var(--transition);
        }
        .close-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(90deg); }

        .nav-links { display: flex; flex-direction: column; position: relative; z-index: 1; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--text-sub);
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 0.02em;
            line-height: 1;
            padding: 18px 0;
            border-bottom: 1px solid var(--bg-card-border);
            transition: color 0.25s var(--transition), padding-left 0.35s cubic-bezier(0.76,0,0.24,1);
            position: relative;
        }

        .nav-item .nav-num {
            font-family: var(--font-family);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--accent);
            min-width: 24px;
            flex-shrink: 0;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0;
            width: 0; height: 1px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.4s var(--transition);
        }

        .nav-item:hover { color: var(--text-main); padding-left: 10px; }
        .nav-item:hover::after { width: 100%; }

        .drawer-footer {
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-sub);
            opacity: 0.6;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .drawer { padding: 96px 28px 36px; }
            .nav-item { font-size: 1.6rem; padding: 15px 0; }
        }

        /* Animation de smash */
        .hero-animation-container {
            position: relative;
            height: 100vh;
            min-height: 560px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 60% 35%, var(--bg-dark-2) 0%, var(--bg-dark) 70%);
            transition: background .4s var(--transition);
        }

        .hero-animation-container::before,
        .hero-animation-container::after {
            content: '';
            position: absolute;
            width: min(58vw, 620px);
            aspect-ratio: 1;
            border: 1px solid rgba(52, 211, 153, 0.16);
            border-radius: 50%;
            pointer-events: none;
            animation: orbitGlow 7s ease-in-out infinite;
        }
        .hero-animation-container::before { transform: translate(28%, -12%) scale(0.75); }
        .hero-animation-container::after { transform: translate(-42%, 38%) scale(0.55); animation-delay: -3.5s; }
        @keyframes orbitGlow {
            50% { border-color: rgba(96, 165, 250, 0.42); box-shadow: 0 0 70px rgba(16, 185, 129, 0.14), inset 0 0 50px rgba(16, 185, 129, 0.08); }
        }

        .hero-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            left: 67.5%;
            top: 31.7%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(16, 185, 129, 0) 70%);
            filter: blur(30px);
            pointer-events: none;
            will-change: transform, opacity;
            animation: ambientGlow 5s ease-in-out infinite alternate;
        }
        @keyframes ambientGlow { to { opacity: .75; transform: translate(-43%, -56%) scale(1.32); filter: blur(50px); } }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-light);
            opacity: 0.5;
            pointer-events: none;
            filter: blur(0.5px);
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: .6; }
            90% { opacity: .5; }
            100% { transform: translateY(-90vh) translateX(20px); opacity: 0; }
        }

        .hero-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform-origin: 67.5% 31.7%;
            will-change: transform;
        }
        .hero-text {
            position: relative;
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            padding: 0 20px;
            z-index: 10;
            animation: titleReveal 1.1s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes titleReveal { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .hero-wordmark {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.2rem, 9vw, 6.2rem);
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: 0.01em;
            line-height: 0.95;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-wordmark span {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-tagline {
            margin-top: 14px;
            color: var(--text-sub);
            font-size: 1.1rem;
            font-weight: 500;
        }
        #racketGroup { transform-box: fill-box; transform-origin: 50% 80%; animation: racketStrike 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
        #birdieGroup { transform-box: fill-box; transform-origin: center; animation: shuttleFloat 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
        #motionGroup { animation: speedTrail 2.8s ease-in-out infinite; }
        @keyframes racketStrike { 0%,100% { transform: rotate(-7deg); } 38% { transform: rotate(13deg); } 58% { transform: rotate(4deg); } }
        @keyframes shuttleFloat { 0%,100% { transform: translate(0, 0) rotate(0deg); opacity: .25; } 42% { transform: translate(-205px, 115px) rotate(-150deg) scale(.72); opacity: 1; } 72% { transform: translate(-260px, 155px) rotate(-200deg) scale(.45); opacity: .2; } }
        @keyframes speedTrail { 0%,100% { opacity: .05; } 40%,60% { opacity: .8; } }

        .hero-kicker {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.08);
            color: var(--accent-light);
            font-size: 0.73rem;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            box-shadow: 0 0 28px rgba(16, 185, 129, 0.12);
        }

        /* CTA intégré au hero (plus de bandeau séparé en bas de page) */

        .btn-spectateur-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: min(100%, 420px);
            margin-top: 32px;
            pointer-events: auto;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            padding: 16px 28px;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            transition: all 0.3s var(--transition);
            box-shadow: 0 10px 25px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }
        .btn-spectateur-main::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: translateX(-120%);
            transition: transform .6s var(--transition);
        }
        .btn-spectateur-main:hover::after { transform: translateX(120%); }

        .btn-spectateur-main:hover {
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 18px 40px var(--accent-glow);
        }
        .btn-spectateur-main .arrow { transition: transform .3s var(--transition); }
        .btn-spectateur-main:hover .arrow { transform: translateX(5px); }

        @media (max-width: 560px) {
            .hero-animation-container { min-height: 440px; }
        }

    </style>

<script src="badsmash-ui.js"></script>
</head>

<div class="badsmash-shuttles" aria-hidden="true">

<style>
    .badsmash-shuttles { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .badsmash-shuttles span {
        position: absolute; bottom: -10%; display: block; opacity: .28;
        filter: drop-shadow(0 0 6px rgba(34,197,94,.3));
        animation: badsmashShuttleFloat linear infinite;
        will-change: transform, opacity;
    }
    :root[data-theme="light"] .badsmash-shuttles span { opacity: .2; filter: drop-shadow(0 0 6px rgba(22,163,74,.22)); }

        0%   { transform: translate(0,0) rotate(-20deg); opacity: 0; }
        10%  { opacity: .28; }
        50%  { transform: translate(30px,-58vh) rotate(15deg); }
        90%  { opacity: .28; }
        100% { transform: translate(-25px,-118vh) rotate(-15deg); opacity: 0; }
    }
    .badsmash-shuttles span:nth-child(1)  { left: 4%;  font-size: 20px; animation-duration: 17s; animation-delay: -2s; }
    .badsmash-shuttles span:nth-child(2)  { left: 14%; font-size: 14px; animation-duration: 13s; animation-delay: -8s; }
    .badsmash-shuttles span:nth-child(3)  { left: 24%; font-size: 24px; animation-duration: 21s; animation-delay: -4s; }
    .badsmash-shuttles span:nth-child(4)  { left: 34%; font-size: 16px; animation-duration: 15s; animation-delay: -11s; }
    .badsmash-shuttles span:nth-child(5)  { left: 44%; font-size: 22px; animation-duration: 19s; animation-delay: -6s; }
    .badsmash-shuttles span:nth-child(6)  { left: 54%; font-size: 15px; animation-duration: 14s; animation-delay: -1s; }
    .badsmash-shuttles span:nth-child(7)  { left: 64%; font-size: 26px; animation-duration: 23s; animation-delay: -14s; }
    .badsmash-shuttles span:nth-child(8)  { left: 73%; font-size: 17px; animation-duration: 16s; animation-delay: -9s; }
    .badsmash-shuttles span:nth-child(9)  { left: 82%; font-size: 21px; animation-duration: 18s; animation-delay: -3s; }
    .badsmash-shuttles span:nth-child(10) { left: 90%; font-size: 14px; animation-duration: 12s; animation-delay: -7s; }
    .badsmash-shuttles span:nth-child(11) { left: 9%;  font-size: 18px; animation-duration: 20s; animation-delay: -16s; }
    .badsmash-shuttles span:nth-child(12) { left: 59%; font-size: 19px; animation-duration: 22s; animation-delay: -18s; }
    @media (prefers-reduced-motion: reduce) { .badsmash-shuttles { display: none; } }
</style>


    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="burger-btn" onclick="toggleMenu()" aria-label="Ouvrir le menu principal" aria-controls="drawer" aria-expanded="false">
                <span class="burger"><span></span><span></span><span></span></span>
            </button>
            <a href="index.html" class="logo">
                BAD<span>SMASH</span>
            </a>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Changer de thème">🌙</button>
            <a href="connexion.html" class="btn-login">Se connecter</a>
        </div>
    </header>

    <!-- Menu Drawer -->
    <div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="drawer" id="drawer">
        <div class="nav-links">
            <a href="spectateur.html" class="nav-item"><span class="nav-num">01</span> Mode Spectateur</a>
            <a href="connexion.html" class="nav-item"><span class="nav-num">02</span> Espace Joueur</a>
            <a href="connexion.html?redirect=coach.html" class="nav-item" id="nav-coach" data-private-target="coach.html"><span class="nav-num">03</span> Coach</a>

        </div>
        <div class="drawer-footer">BADSMASH · Tableaux &amp; classements FFBaD</div>
    </aside>

    <!-- Hero Animation Video Loop -->
    <section class="hero-animation-container">
        <div class="hero-glow" id="heroGlow"></div>
        <div class="particle" style="left:8%; bottom:-20px; width:6px; height:6px; animation-duration:14s; animation-delay:0s;"></div>
        <div class="particle" style="left:22%; bottom:-20px; width:4px; height:4px; animation-duration:11s; animation-delay:2s;"></div>
        <div class="particle" style="left:38%; bottom:-20px; width:5px; height:5px; animation-duration:16s; animation-delay:4s;"></div>
        <div class="particle" style="left:62%; bottom:-20px; width:3px; height:3px; animation-duration:10s; animation-delay:1s;"></div>
        <div class="particle" style="left:78%; bottom:-20px; width:6px; height:6px; animation-duration:13s; animation-delay:3s;"></div>
        <div class="particle" style="left:90%; bottom:-20px; width:4px; height:4px; animation-duration:15s; animation-delay:5s;"></div>

        <svg class="hero-svg" id="heroSvg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <clipPath id="stringsClip">
                    <ellipse cx="0" cy="-140" rx="86" ry="110"/>
                </clipPath>
                <linearGradient id="birdieGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#cbd5e1"/>

    <script>
        function toggleMenu() {
            const drawer = document.getElementById('drawer');
            const isOpen = drawer.classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active', isOpen);
            const btn = document.querySelector('.burger-btn');
            btn.classList.toggle('active', isOpen);
            btn.setAttribute('aria-expanded', String(isOpen));
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && document.getElementById('drawer').classList.contains('active')) toggleMenu();
        });

        // --- Menu « Coach » : accès direct si le joueur est déjà connecté, sinon connexion puis retour sur Coach.
        // (Simple confort de navigation côté navigateur : la présence de l'identifiant dans localStorage n'est pas une authentification sécurisée.)
        (function initCoachLink() {
            const link = document.getElementById('nav-coach');
            if (!link) return;
            function refresh() {
                let logged = false;
                try { logged = !!localStorage.getItem('badsmash_user_id'); } catch (e) {}
                link.setAttribute('href', logged ? link.dataset.privateTarget : 'connexion.html?redirect=' + encodeURIComponent(link.dataset.privateTarget));
            }
            refresh();
            window.addEventListener('pageshow', refresh);
            window.addEventListener('storage', refresh);
        })();

        // --- Thème clair / sombre ---
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('badsmash_theme', theme);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            applyTheme(current === 'light' ? 'dark' : 'light');
        }
        (function initTheme() {
            const saved = localStorage.getItem('badsmash_theme');
            const preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            applyTheme(saved || (preferLight ? 'light' : 'dark'));
        })();
    </script>
