name: Synchroniser les tournois officiels

on:
  workflow_dispatch:
  schedule:
    # Jeudi 06:00, heure de Paris en hiver (UTC). La tâche est aussi lancée
    # toutes les 3 heures afin de rafraîchir les résultats publiés en cours de tournoi.
    - cron: '0 6 * * 4'
    - cron: '0 */3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run sync:official-tournaments
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          # Limite volontairement la charge sur les pages publiques BadNet.
          BADNET_MAX_EVENTS: 40
